[package]
name = "fffbridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
# Local prototype only: requires the reviewed FFF patch via a scratch override.
# Default builds retain the pinned registry API and reject RootOnly requests.
scoped-reads-prototype = []

[dependencies]
fff-search = "=0.11.0"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
