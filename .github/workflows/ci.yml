name: Search Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux native + Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopenblas-dev libomp-dev liblapack-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            build/cargo
            build/deps
            build/native
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('native/fffbridge/Cargo.lock') }}-faiss-fff814dea2bdda020363506904979b204ee201aa

      - name: Download Go dependencies
        run: go mod download

      - name: Test and lint FFF bridge
        run: make rust-test

      - name: Build, test, and vet default VectorFS packages
        run: make build test vet
